 for(let i=0;i<N;i++){for(let j=0;j<3;j++)P[i*3+j]+=V[i*3+j]*dt;
  const zc=P[i*3+2]+CAM,zs=Math.max(zc,.05),scx=C/2+P[i*3]*fo/zs,scy=R/2+P[i*3+1]*fo/zs*asp;
  if(zc<.4||zc>16||Math.abs(scx-C/2)>C*.8||Math.abs(scy-R/2)>R*1.2)spawn(i);
  const a=ph[i]+spn[i]*t,tl=ph[i]*.5+sp2[i]*t,ca=Math.cos(a),sa=Math.sin(a),ct=Math.cos(tl),st=Math.sin(tl);
  for(let k=0;k<K;k++){const q=i*K+k,l=LOC[k],rd=RD[i],lx=l[0]*rd,ly=l[1]*rd,lz=l[2]*rd;
   const x=lx*ca+lz*sa,z0=-lx*sa+lz*ca,y=ly*ct-z0*st,z=ly*st+z0*ct;
   const wz=P[i*3+2]+z+CAM,zp=Math.max(wz,.05),ix=Math.round(C/2+(P[i*3]+x)*fo/zp),iy=Math.round(R/2+(P[i*3+1]+y)*fo/zp*asp),d=cl(1-(wz-.5)/9,0,1);
   pv[q]=wz>.4&&ix>=0&&ix<C&&iy>=0&&iy<R?1:0;pi[q]=ix;pj[q]=iy;pd[q]=d;
   const lv=(d>.3)+(d>.55)+(d>.8),arr=LV[lv];pg[q]=arr[(vr[q]+(x>0?1:0))%arr.length];
   const b=(.22+.78*Math.pow(d,1.1))*fade,pl=pal[i];
   for(let j=0;j<3;j++)pc[q*3+j]=(pl[j]*b+(255-pl[j]*b)*pulse)}}
 gi.fill(0);gc.fill(0);
 for(let lv=0;lv<4;lv++)for(let q=0;q<N*K;q++){if(!pv[q])continue;const d=pd[q];if(((d>.3)+(d>.55)+(d>.8))!==lv)continue;
  const n=pj[q]*C+pi[q];gi[n]=pg[q];for(let j=0;j<3;j++)gc[n*3+j]=cl(pc[q*3+j],0,255);
  if(lv===3&&pi[q]+1<C){gi[n+1]=pg[q];for(let j=0;j<3;j++)gc[(n+1)*3+j]=cl(pc[q*3+j],0,255)}}
 compose(1)}};
// BUCLE
const SC=[S1,S2,S3],btn=[...document.querySelectorAll('button[data-s]')],info=document.getElementById('info'),pz=document.getElementById('pz');
let cur=0,t=0,paused=false,prev=performance.now(),fps=60;
function go(i){cur=i;t=0;SC[i].start();btn.forEach((b,j)=>b.classList.toggle('on',j===i))}
btn.forEach(b=>b.onclick=()=>go(+b.dataset.s));
pz.onclick=()=>{paused=!paused;pz.textContent=paused?'Reanudar':'Pausa'};
go(0);
(function loop(now){const dt=Math.min((now-prev)/1000,.05);prev=now;fps=fps*.95+(1/Math.max(dt,.001))*.05;
 if(!paused){t+=dt;if(t>SC[cur].D)go((cur+1)%3)}
 SC[cur].render(t);info.textContent=`${C}x${R} · ${fps.toFixed(0)} fps · ${t.toFixed(1)}s`;requestAnimationFrame(loop)})(prev);
}
